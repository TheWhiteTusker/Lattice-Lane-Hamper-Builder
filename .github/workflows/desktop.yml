# Builds the Windows desktop app from main and publishes it. Installed apps
# see the new version on their next launch
# and offer "Update now" (electron/main.cjs). The website deploys separately,
# through Cloudflare Workers Builds.
#
# Needs one repo secret: CLOUDFLARE_API_TOKEN, with Workers R2 Storage: Edit.
# The website needs GITHUB_TOKEN to start it (see publishDesktopApp).
name: Desktop app

on:
  # Started by the "Update the app" button on the website's Settings page,
  # or by hand from the repo's Actions tab.
  workflow_dispatch:

# A second click supersedes a build still in progress.
concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9f6e639623659c53ac7f9b62cf26c7c7
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build/icon.ico is generated from src/app/icon.png with Pillow.
      - run: pip install pillow

      # Version = major.minor from package.json + this run's number, so every
      # release is newer than the last without committing a bump. Change
      # major.minor in package.json by hand for a big release.
      - name: Set version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm pkg set version="$base.${{ github.run_number }}"
          node -p "'Releasing ' + require('./package.json').version"

      - run: pnpm build:desktop

      - run: pnpm publish:desktop
