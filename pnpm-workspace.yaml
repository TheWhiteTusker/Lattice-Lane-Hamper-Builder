# Single-package repo. This file exists only to allow build scripts, but pnpm 10
# treats any pnpm-workspace.yaml as a workspace root and refuses to install
# without a packages field ("packages field missing or empty"), so it is
# declared explicitly.
packages:
  - .

# These ship native binaries and need their postinstall to run:
#   unrs-resolver  via eslint-config-next
#   esbuild        via @opennextjs/cloudflare
#   workerd        the Cloudflare Workers runtime, via wrangler
# pnpm renamed this setting between majors, so both spellings are present and
# whichever pnpm runs will find one of them.
onlyBuiltDependencies: # pnpm 10
  - unrs-resolver
  - esbuild
  - workerd
allowBuilds: # pnpm 11
  unrs-resolver: true
  esbuild: true
  workerd: true

# Flat node_modules. OpenNext's bundler symlinks pnpm's nested layout while
# tracing files, which Windows refuses without elevation (EPERM), so
# `pnpm run cf:build` cannot run locally under the default layout. Hoisting is
# more permissive than the default, so CI is unaffected.
nodeLinker: hoisted
